<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>photography — nate gudmestad</title>

  <link rel="stylesheet" href="../assets/css/base.css?v=1">
  <link rel="stylesheet" href="../assets/css/glass.css?v=1">
  <link rel="stylesheet" href="assets/css/photography.css?v=2">
</head>

<body>
  <header class="site-header site-header--fixed">
    <a class="home-link" href="../index.html" aria-label="Return home">
      <img
        class="signature"
        src="../assets/images/signature.png"
        alt="Nate Gudmestad"
      >
    </a>
  </header>

  <main class="photography">
    <h1 class="visually-hidden">Photography projects</h1>

    <div
      class="carousel"
      id="projectCarousel"
      tabindex="0"
      aria-label="Photography projects. Scroll, swipe horizontally, or use the left and right arrow keys to browse."
    >
      <div class="project-track">
        <a class="project-card" href="projects/cap-hill.html" aria-label="Open cap hill">
          <span class="project-image">
            <img src="photos/caphill-thumbnail.jpg" alt="cap hill cover" width="2048" height="2048" draggable="false" decoding="async">
          </span>
          <span class="project-title"><span class="project-title-text glass-text" data-label="cap hill">cap hill</span></span>
        </a>

        <a class="project-card" href="projects/fashion.html" aria-label="Open fashion">
          <span class="project-image">
            <img src="photos/fashion-thumbnail.jpg" alt="fashion cover" width="2075" height="2075" draggable="false" decoding="async">
          </span>
          <span class="project-title"><span class="project-title-text glass-text" data-label="fashion">fashion</span></span>
        </a>

        <a class="project-card" href="projects/italy.html" aria-label="Open italy">
          <span class="project-image">
            <img src="photos/italy-thumbnail.jpg" alt="italy cover" width="1105" height="1105" draggable="false" decoding="async">
          </span>
          <span class="project-title"><span class="project-title-text glass-text" data-label="italy">italy</span></span>
        </a>

        <a class="project-card" href="projects/sawtooth.html" aria-label="Open sawtooth">
          <span class="project-image">
            <img src="photos/sawtooths-thumbnail.jpg" alt="sawtooth cover" width="1105" height="1105" draggable="false" decoding="async">
          </span>
          <span class="project-title"><span class="project-title-text glass-text" data-label="sawtooth">sawtooth</span></span>
        </a>

        <a class="project-card" href="projects/seattle.html" aria-label="Open seattle">
          <span class="project-image">
            <img src="photos/seattle-thumbnail.jpg" alt="seattle cover" width="883" height="883" draggable="false" decoding="async">
          </span>
          <span class="project-title"><span class="project-title-text glass-text" data-label="seattle">seattle</span></span>
        </a>

        <a class="project-card" href="projects/wallingford.html" aria-label="Open wallingford">
          <span class="project-image">
            <img src="photos/wallingford-thumbnail.jpg" alt="wallingford cover" width="1105" height="1105" draggable="false" decoding="async">
          </span>
          <span class="project-title"><span class="project-title-text glass-text" data-label="wallingford">wallingford</span></span>
        </a>
      </div>
    </div>
  </main>

  <script src="assets/js/thumbnail-rail.js?v=1"></script>
  <script src="../assets/js/glass.js?v=2"></script>
  <script src="assets/js/photography.js?v=2"></script>
</body>
</html>
