  <div
    class="photo-overlay"
    id="photoOverlay"
  ></div>


  <script>
    const wrapper =
      document.getElementById("filmstripWrapper");

    const strip =
      document.getElementById("filmstrip");

    const cards =
      [...document.querySelectorAll(".photo-card")];

    const overlay =
      document.getElementById("photoOverlay");


    /* --------------------------------
       DEVICE
    -------------------------------- */

    const desktopHover =
      window.matchMedia(
        "(hover: hover) and (pointer: fine)"
      );


    /* --------------------------------
       FILMSTRIP STATE
    -------------------------------- */

    let currentX = 0;
    let targetX = 0;
    let velocity = 0;

    let dragging = false;

    let pointerStartX = 0;
    let pointerStartY = 0;

    let lastPointerX = 0;
    let lastMoveTime = 0;

    let moved = false;

    let pointerX = null;
    let pointerInside = false;


    /* --------------------------------
       FULL PHOTO STATE
    -------------------------------- */

    let activeImage = null;
    let originalImage = null;
    let closing = false;


    /* --------------------------------
       SETTINGS
    -------------------------------- */

    const MAX_SCALE = 1.34;
    const MAGNET_DISTANCE = 190;
    const MAGNET_SMOOTHNESS = 0.16;

    const STRIP_SMOOTHNESS = 0.12;
    const SCROLL_SPEED = 1.05;
    const FRICTION = 0.92;

    const DRAG_THRESHOLD = 8;

    const PHOTO_ANIMATION_TIME = 560;


    /* --------------------------------
       FILMSTRIP BOUNDS
    -------------------------------- */

    function getBounds() {
      if (!cards.length) {
        return {
          min: 0,
          max: 0
        };
      }

      const firstCard = cards[0];
      const lastCard = cards[cards.length - 1];

      const wrapperCenter =
        wrapper.clientWidth / 2;

      const firstCenter =
        firstCard.offsetLeft +
        firstCard.offsetWidth / 2;

      const lastCenter =
        lastCard.offsetLeft +
        lastCard.offsetWidth / 2;

      return {
        max: wrapperCenter - firstCenter,
        min: wrapperCenter - lastCenter
      };
    }


    function clampTarget() {
      const bounds = getBounds();

      targetX =
        Math.max(
          bounds.min,
          Math.min(
            bounds.max,
            targetX
          )
        );
    }


    function centerFirstPhoto() {
      const bounds = getBounds();

      currentX = bounds.max;
      targetX = bounds.max;
    }


    /* --------------------------------
       FULL PHOTO SIZE
    -------------------------------- */

    function getExpandedSize(image) {
      const naturalWidth =
        image.naturalWidth || 1;

      const naturalHeight =
        image.naturalHeight || 1;

      const ratio =
        naturalWidth / naturalHeight;

      const mobile =
        window.innerWidth <= 700;

      const maxWidth =
        window.innerWidth *
        (mobile ? 0.92 : 0.88);

      const maxHeight =
        window.innerHeight *
        (mobile ? 0.78 : 0.86);

      let width = maxWidth;
      let height = width / ratio;

      if (height > maxHeight) {
        height = maxHeight;
        width = height * ratio;
      }

      return {
        width,
        height
      };
    }


    /* --------------------------------
       OPEN PHOTO
    -------------------------------- */

    function openPhoto(photo) {
      if (
        activeImage ||
        closing
      ) {
        return;
      }

      dragging = false;
      velocity = 0;

      originalImage = photo;

      const start =
        photo.getBoundingClientRect();

      const enlarged =
        document.createElement("img");

      enlarged.src = photo.src;
      enlarged.className =
        "expanded-photo";

      enlarged.style.left =
        `${start.left}px`;

      enlarged.style.top =
        `${start.top}px`;

      enlarged.style.width =
        `${start.width}px`;

      enlarged.style.height =
        `${start.height}px`;

      document.body.appendChild(
        enlarged
      );

      activeImage = enlarged;

      originalImage.style.visibility =
        "hidden";

      document.body.classList.add(
        "photo-open"
      );

      overlay.classList.add(
        "active"
      );

      pointerInside = false;
      pointerX = null;

      requestAnimationFrame(() => {

        requestAnimationFrame(() => {

          if (!activeImage) return;

          const target =
            getExpandedSize(
              originalImage
            );

          activeImage.style.left =
            `${
              (
                window.innerWidth -
                target.width
              ) / 2
            }px`;

          activeImage.style.top =
            `${
              (
                window.innerHeight -
                target.height
              ) / 2
            }px`;

          activeImage.style.width =
            `${target.width}px`;

          activeImage.style.height =
            `${target.height}px`;

        });

      });
    }


    /* --------------------------------
       CLOSE PHOTO
    -------------------------------- */

    function closePhoto() {
      if (
        !activeImage ||
        !originalImage ||
        closing
      ) {
        return;
      }

      closing = true;

      const enlarged =
        activeImage;

      const source =
        originalImage;

      const end =
        source.getBoundingClientRect();

      enlarged.style.left =
        `${end.left}px`;

      enlarged.style.top =
        `${end.top}px`;

      enlarged.style.width =
        `${end.width}px`;

      enlarged.style.height =
        `${end.height}px`;

      overlay.classList.remove(
        "active"
      );

      window.setTimeout(() => {

        source.style.visibility =
          "visible";

        enlarged.remove();

        activeImage = null;
        originalImage = null;
        closing = false;

        document.body.classList.remove(
          "photo-open"
        );

        velocity = 0;

      }, PHOTO_ANIMATION_TIME + 50);
    }


    /* --------------------------------
       MOUSE WHEEL / TRACKPAD
    -------------------------------- */

    wrapper.addEventListener(
      "wheel",
      event => {

        if (activeImage) return;

        event.preventDefault();

        const amount =
          Math.abs(event.deltaY) >
          Math.abs(event.deltaX)
            ? event.deltaY
            : event.deltaX;

        targetX -=
          amount * SCROLL_SPEED;

        velocity =
          -amount * 0.055;

        clampTarget();

      },
      {
        passive: false
      }
    );


    /* --------------------------------
       POINTER DOWN
    -------------------------------- */

    wrapper.addEventListener(
      "pointerdown",
      event => {

        if (activeImage) return;

        dragging = true;
        moved = false;

        pointerStartX =
          event.clientX;

        pointerStartY =
          event.clientY;

        lastPointerX =
          event.clientX;

        lastMoveTime =
          performance.now();

        velocity = 0;

        if (desktopHover.matches) {
          pointerInside = true;
          pointerX = event.clientX;
        }

        try {
          wrapper.setPointerCapture(
            event.pointerId
          );
        } catch (error) {}

      }
    );


    /* --------------------------------
       POINTER MOVE
    -------------------------------- */

    wrapper.addEventListener(
      "pointermove",
      event => {

        if (
          desktopHover.matches &&
          !activeImage
        ) {
          pointerInside = true;
          pointerX = event.clientX;
        }

        if (
          !dragging ||
          activeImage
        ) {
          return;
        }

        const horizontalDistance =
          event.clientX -
          pointerStartX;

        const verticalDistance =
          event.clientY -
          pointerStartY;

        if (
          Math.abs(horizontalDistance) >
          DRAG_THRESHOLD
        ) {
          moved = true;
        }

        /*
          On touch devices, only take over
          when the movement is primarily horizontal.
          Vertical swipes remain normal page scrolling.
        */
        if (
          event.pointerType === "touch" &&
          Math.abs(verticalDistance) >
          Math.abs(horizontalDistance)
        ) {
          return;
        }

        const now =
          performance.now();

        const difference =
          event.clientX -
          lastPointerX;

        const elapsed =
          Math.max(
            now - lastMoveTime,
            1
          );

        targetX += difference;

        velocity =
          (
            difference /
            elapsed
          ) * 15;

        clampTarget();

        lastPointerX =
          event.clientX;

        lastMoveTime = now;

      }
    );


    /* --------------------------------
       POINTER UP
    -------------------------------- */

    wrapper.addEventListener(
      "pointerup",
      event => {

        if (!dragging) return;

        dragging = false;

        try {
          wrapper.releasePointerCapture(
            event.pointerId
          );
        } catch (error) {}

        /*
          A small movement = tap/click.
          A larger movement = drag.
        */

        if (!moved) {

          const element =
            document.elementFromPoint(
              event.clientX,
              event.clientY
            );

          const card =
            element?.closest(
              ".photo-card"
            );

          if (card) {
            const photo =
              card.querySelector(
                ".photo"
              );

            openPhoto(photo);
          }
        }

        if (!desktopHover.matches) {
          pointerInside = false;
          pointerX = null;
        }

      }
    );


    wrapper.addEventListener(
      "pointercancel",
      () => {

        dragging = false;

        if (!desktopHover.matches) {
          pointerInside = false;
          pointerX = null;
        }

      }
    );


    /* --------------------------------
       DESKTOP HOVER
    -------------------------------- */

    wrapper.addEventListener(
      "pointerenter",
      event => {

        if (
          !desktopHover.matches ||
          activeImage
        ) {
          return;
        }

        pointerInside = true;
        pointerX = event.clientX;

      }
    );


    wrapper.addEventListener(
      "pointerleave",
      () => {

        if (!desktopHover.matches) {
          return;
        }

        pointerInside = false;
        pointerX = null;

      }
    );


    /* --------------------------------
       FULLSCREEN CLOSE EVENTS
    -------------------------------- */

    overlay.addEventListener(
      "click",
      closePhoto
    );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape"
        ) {
          closePhoto();
        }

      }
    );


    /* --------------------------------
       MAGNIFICATION
    -------------------------------- */

    function updateMagnification() {

      cards.forEach(card => {

        let targetScale = 1;

        /*
          Hover magnification ONLY runs
          on devices with a real mouse/trackpad.
        */

        if (
          desktopHover.matches &&
          pointerInside &&
          pointerX !== null &&
          !activeImage
        ) {

          const rect =
            card.getBoundingClientRect();

          const center =
            rect.left +
            rect.width / 2;

          const distance =
            Math.abs(
              pointerX - center
            );

          let influence =
            1 -
            distance /
            MAGNET_DISTANCE;

          influence =
            Math.max(
              0,
              Math.min(
                1,
                influence
              )
            );

          influence =
            influence *
            influence *
            (
              3 -
              2 * influence
            );

          targetScale =
            1 +
            influence *
            (
              MAX_SCALE - 1
            );
        }

        if (
          card.currentScale ===
          undefined
        ) {
          card.currentScale = 1;
        }

        card.currentScale +=
          (
            targetScale -
            card.currentScale
          ) *
          MAGNET_SMOOTHNESS;

        card.style.transform =
          `scale(${card.currentScale})`;

        card.style.zIndex =
          Math.round(
            card.currentScale * 100
          );

      });
    }


    /* --------------------------------
       MAIN ANIMATION LOOP
    -------------------------------- */

    function animate() {

      if (
        !dragging &&
        !activeImage
      ) {

        targetX += velocity;

        clampTarget();

        velocity *= FRICTION;

        /*
          Stop inertia when it reaches
          either end of the gallery.
        */

        const bounds =
          getBounds();

        if (
          targetX <= bounds.min ||
          targetX >= bounds.max
        ) {
          velocity *= 0.55;
        }

        if (
          Math.abs(velocity) < 0.01
        ) {
          velocity = 0;
        }
      }

      currentX +=
        (
          targetX -
          currentX
        ) *
        STRIP_SMOOTHNESS;

      strip.style.transform =
        `translate3d(${currentX}px, 0, 0)`;

      updateMagnification();

      requestAnimationFrame(
        animate
      );
    }


    /* --------------------------------
       RESIZE
    -------------------------------- */

    window.addEventListener(
      "resize",
      () => {

        clampTarget();

        if (
          activeImage &&
          originalImage &&
          !closing
        ) {

          const target =
            getExpandedSize(
              originalImage
            );

          activeImage.style.left =
            `${
              (
                window.innerWidth -
                target.width
              ) / 2
            }px`;

          activeImage.style.top =
            `${
              (
                window.innerHeight -
                target.height
              ) / 2
            }px`;

          activeImage.style.width =
            `${target.width}px`;

          activeImage.style.height =
            `${target.height}px`;
        }

      }
    );


    /* --------------------------------
       START
    -------------------------------- */

    window.addEventListener(
      "load",
      () => {

        centerFirstPhoto();
        animate();

      }
    );
  </script>
