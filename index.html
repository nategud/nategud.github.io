  <div
    class="photo-overlay"
    id="photoOverlay"
  ></div>


  <script>
    const wrapper = document.getElementById("filmstripWrapper");
    const strip = document.getElementById("filmstrip");
    const cards = [...document.querySelectorAll(".photo-card")];
    const overlay = document.getElementById("photoOverlay");

    const finePointer = window.matchMedia(
      "(hover: hover) and (pointer: fine)"
    );

    let currentX = 0;
    let targetX = 0;
    let velocity = 0;

    let dragging = false;
    let moved = false;
    let activePointerType = null;

    let pointerStartX = 0;
    let pointerStartY = 0;
    let lastPointerX = 0;
    let lastMoveTime = 0;

    let hoverX = null;
    let hoverInside = false;

    let activeImage = null;
    let originalImage = null;
    let closing = false;

    const DESKTOP_MAX_SCALE = 1.34;
    const DESKTOP_MAGNET_DISTANCE = 190;

    const TOUCH_MAX_SCALE = 1.17;
    const TOUCH_MAGNET_DISTANCE = 205;

    const SCALE_SMOOTHNESS_DESKTOP = 0.16;
    const SCALE_SMOOTHNESS_TOUCH = 0.20;

    const STRIP_SMOOTHNESS = 0.12;
    const SCROLL_SPEED = 1.05;

    const DESKTOP_FRICTION = 0.92;
    const TOUCH_FRICTION = 0.94;

    const MAX_TOUCH_VELOCITY = 34;
    const DRAG_THRESHOLD = 7;

    const PHOTO_ANIMATION_TIME = 560;


    function clamp(value, min, max) {
      return Math.max(
        min,
        Math.min(max, value)
      );
    }


    function smoothstep(value) {
      return value * value * (3 - 2 * value);
    }


    function getBounds() {
      if (!cards.length) {
        return {
          min: 0,
          max: 0
        };
      }

      const firstCard = cards[0];
      const lastCard = cards[cards.length - 1];

      const wrapperCenter =
        wrapper.clientWidth / 2;

      const firstCenter =
        firstCard.offsetLeft +
        firstCard.offsetWidth / 2;

      const lastCenter =
        lastCard.offsetLeft +
        lastCard.offsetWidth / 2;

      return {
        max: wrapperCenter - firstCenter,
        min: wrapperCenter - lastCenter
      };
    }


    function clampTarget() {
      const bounds = getBounds();

      targetX = clamp(
        targetX,
        bounds.min,
        bounds.max
      );
    }


    function centerFirstPhoto() {
      const bounds = getBounds();

      currentX = bounds.max;
      targetX = bounds.max;
    }


    function getExpandedSize(image) {
      const naturalWidth =
        image.naturalWidth || 1;

      const naturalHeight =
        image.naturalHeight || 1;

      const ratio =
        naturalWidth / naturalHeight;

      const mobile =
        window.innerWidth <= 700;

      const maxWidth =
        window.innerWidth *
        (mobile ? 0.92 : 0.88);

      const maxHeight =
        window.innerHeight *
        (mobile ? 0.78 : 0.86);

      let width = maxWidth;
      let height = width / ratio;

      if (height > maxHeight) {
        height = maxHeight;
        width = height * ratio;
      }

      return {
        width,
        height
      };
    }


    function positionExpandedPhoto() {
      if (
        !activeImage ||
        !originalImage
      ) {
        return;
      }

      const target =
        getExpandedSize(originalImage);

      activeImage.style.left =
        `${(window.innerWidth - target.width) / 2}px`;

      activeImage.style.top =
        `${(window.innerHeight - target.height) / 2}px`;

      activeImage.style.width =
        `${target.width}px`;

      activeImage.style.height =
        `${target.height}px`;
    }


    function openPhoto(photo) {
      if (
        activeImage ||
        closing
      ) {
        return;
      }

      dragging = false;
      velocity = 0;

      originalImage = photo;

      const start =
        photo.getBoundingClientRect();

      const enlarged =
        document.createElement("img");

      enlarged.src = photo.src;
      enlarged.className =
        "expanded-photo";

      enlarged.style.left =
        `${start.left}px`;

      enlarged.style.top =
        `${start.top}px`;

      enlarged.style.width =
        `${start.width}px`;

      enlarged.style.height =
        `${start.height}px`;

      document.body.appendChild(
        enlarged
      );

      activeImage = enlarged;

      originalImage.style.visibility =
        "hidden";

      document.body.classList.add(
        "photo-open"
      );

      overlay.classList.add(
        "active"
      );

      hoverInside = false;
      hoverX = null;

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          positionExpandedPhoto();
        });
      });
    }


    function closePhoto() {
      if (
        !activeImage ||
        !originalImage ||
        closing
      ) {
        return;
      }

      closing = true;

      const enlarged =
        activeImage;

      const source =
        originalImage;

      const end =
        source.getBoundingClientRect();

      enlarged.style.left =
        `${end.left}px`;

      enlarged.style.top =
        `${end.top}px`;

      enlarged.style.width =
        `${end.width}px`;

      enlarged.style.height =
        `${end.height}px`;

      overlay.classList.remove(
        "active"
      );

      window.setTimeout(() => {
        source.style.visibility =
          "visible";

        enlarged.remove();

        activeImage = null;
        originalImage = null;
        closing = false;
        velocity = 0;

        document.body.classList.remove(
          "photo-open"
        );
      }, PHOTO_ANIMATION_TIME + 50);
    }


    wrapper.addEventListener(
      "wheel",
      event => {
        if (activeImage) return;

        event.preventDefault();

        const amount =
          Math.abs(event.deltaY) >
          Math.abs(event.deltaX)
            ? event.deltaY
            : event.deltaX;

        targetX -=
          amount * SCROLL_SPEED;

        velocity =
          -amount * 0.055;

        clampTarget();
      },
      {
        passive: false
      }
    );


    wrapper.addEventListener(
      "pointerdown",
      event => {
        if (activeImage) return;

        dragging = true;
        moved = false;

        activePointerType =
          event.pointerType;

        pointerStartX =
          event.clientX;

        pointerStartY =
          event.clientY;

        lastPointerX =
          event.clientX;

        lastMoveTime =
          performance.now();

        velocity = 0;

        if (finePointer.matches) {
          hoverInside = true;
          hoverX = event.clientX;
        }

        try {
          wrapper.setPointerCapture(
            event.pointerId
          );
        } catch (error) {}
      }
    );


    wrapper.addEventListener(
      "pointermove",
      event => {
        if (
          finePointer.matches &&
          !activeImage
        ) {
          hoverInside = true;
          hoverX = event.clientX;
        }

        if (
          !dragging ||
          activeImage
        ) {
          return;
        }

        const now =
          performance.now();

        const totalX =
          event.clientX -
          pointerStartX;

        const totalY =
          event.clientY -
          pointerStartY;

        const difference =
          event.clientX -
          lastPointerX;

        const elapsed =
          Math.max(
            now - lastMoveTime,
            1
          );

        if (
          event.pointerType === "touch"
        ) {
          if (
            !moved &&
            Math.abs(totalY) >
            Math.abs(totalX)
          ) {
            lastPointerX =
              event.clientX;

            lastMoveTime = now;

            return;
          }
        }

        if (
          Math.abs(totalX) >
          DRAG_THRESHOLD
        ) {
          moved = true;
        }

        if (moved) {
          targetX += difference;

          clampTarget();

          const instantVelocity =
            (difference / elapsed) * 16;

          if (
            event.pointerType === "touch"
          ) {
            const limitedVelocity =
              clamp(
                instantVelocity,
                -MAX_TOUCH_VELOCITY,
                MAX_TOUCH_VELOCITY
              );

            velocity =
              velocity * 0.55 +
              limitedVelocity * 0.45;
          } else {
            velocity =
              instantVelocity;
          }
        }

        lastPointerX =
          event.clientX;

        lastMoveTime = now;
      }
    );


    wrapper.addEventListener(
      "pointerup",
      event => {
        if (!dragging) return;

        const wasMoved = moved;
        const pointerType =
          activePointerType;

        dragging = false;
        activePointerType = null;

        try {
          wrapper.releasePointerCapture(
            event.pointerId
          );
        } catch (error) {}

        if (!wasMoved) {
          velocity = 0;

          const element =
            document.elementFromPoint(
              event.clientX,
              event.clientY
            );

          const card =
            element?.closest(
              ".photo-card"
            );

          if (card) {
            const photo =
              card.querySelector(
                ".photo"
              );

            openPhoto(photo);
          }
        }

        if (
          pointerType !== "mouse"
        ) {
          hoverInside = false;
          hoverX = null;
        }
      }
    );


    wrapper.addEventListener(
      "pointercancel",
      () => {
        dragging = false;
        activePointerType = null;

        hoverInside = false;
        hoverX = null;
      }
    );


    wrapper.addEventListener(
      "pointerenter",
      event => {
        if (
          !finePointer.matches ||
          activeImage
        ) {
          return;
        }

        hoverInside = true;
        hoverX = event.clientX;
      }
    );


    wrapper.addEventListener(
      "pointerleave",
      () => {
        if (!finePointer.matches) {
          return;
        }

        hoverInside = false;
        hoverX = null;
      }
    );


    overlay.addEventListener(
      "click",
      closePhoto
    );


    document.addEventListener(
      "keydown",
      event => {
        if (event.key === "Escape") {
          closePhoto();
        }
      }
    );


    function updateMagnification() {
      /*
        Freeze thumbnail transforms while
        a photo is expanded so the closing
        animation returns to the exact same
        visual position and size.
      */

      if (activeImage) {
        return;
      }

      let focalX;
      let maxScale;
      let magnetDistance;
      let smoothness;

      if (finePointer.matches) {
        if (
          !hoverInside ||
          hoverX === null
        ) {
          focalX = null;
        } else {
          focalX = hoverX;
        }

        maxScale =
          DESKTOP_MAX_SCALE;

        magnetDistance =
          DESKTOP_MAGNET_DISTANCE;

        smoothness =
          SCALE_SMOOTHNESS_DESKTOP;
      } else {
        /*
          On touch screens the center of
          the viewport acts like the hover
          position.

          As photos move through the center,
          they smoothly grow and shrink.
        */

        focalX =
          wrapper.clientWidth / 2;

        maxScale =
          TOUCH_MAX_SCALE;

        magnetDistance =
          TOUCH_MAGNET_DISTANCE;

        smoothness =
          SCALE_SMOOTHNESS_TOUCH;
      }

      cards.forEach(card => {
        let targetScale = 1;

        if (focalX !== null) {
          const cardCenter =
            card.offsetLeft +
            card.offsetWidth / 2 +
            currentX;

          const distance =
            Math.abs(
              focalX - cardCenter
            );

          let influence =
            1 -
            distance /
            magnetDistance;

          influence =
            clamp(
              influence,
              0,
              1
            );

          influence =
            smoothstep(influence);

          targetScale =
            1 +
            influence *
            (maxScale - 1);
        }

        if (
          card.currentScale ===
          undefined
        ) {
          card.currentScale = 1;
        }

        card.currentScale +=
          (
            targetScale -
            card.currentScale
          ) *
          smoothness;

        card.style.transform =
          `translateZ(0) scale(${card.currentScale})`;

        card.style.zIndex =
          Math.round(
            card.currentScale * 100
          );
      });
    }


    function animate() {
      if (
        dragging &&
        activePointerType === "touch"
      ) {
        /*
          Touch should feel physically
          attached to the finger.
        */

        currentX = targetX;
      } else {
        if (
          !dragging &&
          !activeImage
        ) {
          targetX += velocity;

          clampTarget();

          const friction =
            finePointer.matches
              ? DESKTOP_FRICTION
              : TOUCH_FRICTION;

          velocity *= friction;

          const bounds =
            getBounds();

          if (
            targetX <= bounds.min ||
            targetX >= bounds.max
          ) {
            velocity *= 0.45;
          }

          if (
            Math.abs(velocity) < 0.01
          ) {
            velocity = 0;
          }
        }

        currentX +=
          (
            targetX -
            currentX
          ) *
          STRIP_SMOOTHNESS;
      }

      strip.style.transform =
        `translate3d(${currentX}px, 0, 0)`;

      updateMagnification();

      requestAnimationFrame(
        animate
      );
    }


    window.addEventListener(
      "resize",
      () => {
        clampTarget();

        currentX = clamp(
          currentX,
          getBounds().min,
          getBounds().max
        );

        if (
          activeImage &&
          originalImage &&
          !closing
        ) {
          positionExpandedPhoto();
        }
      }
    );


    window.addEventListener(
      "load",
      () => {
        centerFirstPhoto();
        animate();
      }
    );

  </script>
