  <div
    class="photo-overlay"
    id="photoOverlay"
  ></div>


  <script>
    const wrapper = document.getElementById("filmstripWrapper");
    const strip = document.getElementById("filmstrip");
    const cards = [...document.querySelectorAll(".photo-card")];
    const overlay = document.getElementById("photoOverlay");

    const desktopMode = window.matchMedia(
      "(hover: hover) and (pointer: fine)"
    );


    /* DESKTOP FILMSTRIP */

    let currentX = 0;
    let targetX = 0;
    let velocity = 0;

    let dragging = false;
    let desktopMoved = false;

    let dragStartX = 0;
    let lastPointerX = 0;
    let lastMoveTime = 0;

    let mouseX = null;
    let mouseInside = false;


    /* TOUCH */

    let touchStartX = 0;
    let touchStartY = 0;
    let touchMoved = false;


    /* FULL PHOTO */

    let activeImage = null;
    let originalImage = null;
    let closing = false;


    /* SETTINGS */

    const DESKTOP_MAX_SCALE = 1.28;
    const DESKTOP_MAGNET_DISTANCE = 270;
    const DESKTOP_SCALE_SPEED = 0.16;

    const TOUCH_MAX_SCALE = 1.10;
    const TOUCH_MAGNET_DISTANCE = 260;

    const TOUCH_SPRING = 0.13;
    const TOUCH_DAMPING = 0.72;

    const DESKTOP_SCROLL_SPEED = 1.05;
    const DESKTOP_FRICTION = 0.92;
    const DESKTOP_STRIP_SMOOTHNESS = 0.12;

    const DRAG_THRESHOLD = 7;

    const PHOTO_ANIMATION_TIME = 560;


    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }


    function smoothstep(value) {
      return value * value * (3 - 2 * value);
    }


    /* DESKTOP BOUNDS */

    function getDesktopBounds() {
      if (!cards.length) {
        return {
          min: 0,
          max: 0
        };
      }

      const first = cards[0];
      const last = cards[cards.length - 1];

      const wrapperCenter =
        wrapper.clientWidth / 2;

      const firstCenter =
        first.offsetLeft +
        first.offsetWidth / 2;

      const lastCenter =
        last.offsetLeft +
        last.offsetWidth / 2;

      return {
        max: wrapperCenter - firstCenter,
        min: wrapperCenter - lastCenter
      };
    }


    function clampDesktopTarget() {
      const bounds =
        getDesktopBounds();

      targetX =
        clamp(
          targetX,
          bounds.min,
          bounds.max
        );
    }


    function centerDesktopStart() {
      const bounds =
        getDesktopBounds();

      currentX = bounds.max;
      targetX = bounds.max;
    }


    /* FULL PHOTO */

    function getExpandedSize(image) {
      const naturalWidth =
        image.naturalWidth || 1;

      const naturalHeight =
        image.naturalHeight || 1;

      const ratio =
        naturalWidth /
        naturalHeight;

      const phone =
        window.innerWidth <= 700;

      const maxWidth =
        window.innerWidth *
        (phone ? 0.94 : 0.88);

      const maxHeight =
        window.innerHeight *
        (phone ? 0.80 : 0.86);

      let width = maxWidth;
      let height = width / ratio;

      if (height > maxHeight) {
        height = maxHeight;
        width = height * ratio;
      }

      return {
        width,
        height
      };
    }


    function positionExpandedPhoto() {
      if (
        !activeImage ||
        !originalImage
      ) {
        return;
      }

      const target =
        getExpandedSize(
          originalImage
        );

      activeImage.style.left =
        `${(window.innerWidth - target.width) / 2}px`;

      activeImage.style.top =
        `${(window.innerHeight - target.height) / 2}px`;

      activeImage.style.width =
        `${target.width}px`;

      activeImage.style.height =
        `${target.height}px`;
    }


    function openPhoto(photo) {
      if (
        activeImage ||
        closing
      ) {
        return;
      }

      dragging = false;
      velocity = 0;

      originalImage = photo;

      const start =
        photo.getBoundingClientRect();

      const enlarged =
        document.createElement("img");

      enlarged.src = photo.src;
      enlarged.className =
        "expanded-photo";

      enlarged.style.left =
        `${start.left}px`;

      enlarged.style.top =
        `${start.top}px`;

      enlarged.style.width =
        `${start.width}px`;

      enlarged.style.height =
        `${start.height}px`;

      document.body.appendChild(
        enlarged
      );

      activeImage = enlarged;

      originalImage.style.visibility =
        "hidden";

      document.body.classList.add(
        "photo-open"
      );

      overlay.classList.add(
        "active"
      );

      mouseInside = false;
      mouseX = null;

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          positionExpandedPhoto();
        });
      });
    }


    function closePhoto() {
      if (
        !activeImage ||
        !originalImage ||
        closing
      ) {
        return;
      }

      closing = true;

      const enlarged =
        activeImage;

      const source =
        originalImage;

      const end =
        source.getBoundingClientRect();

      enlarged.style.left =
        `${end.left}px`;

      enlarged.style.top =
        `${end.top}px`;

      enlarged.style.width =
        `${end.width}px`;

      enlarged.style.height =
        `${end.height}px`;

      overlay.classList.remove(
        "active"
      );

      window.setTimeout(() => {
        source.style.visibility =
          "visible";

        enlarged.remove();

        activeImage = null;
        originalImage = null;
        closing = false;
        velocity = 0;

        document.body.classList.remove(
          "photo-open"
        );
      }, PHOTO_ANIMATION_TIME + 50);
    }


    /* DESKTOP WHEEL */

    wrapper.addEventListener(
      "wheel",
      event => {
        if (
          !desktopMode.matches ||
          activeImage
        ) {
          return;
        }

        event.preventDefault();

        const amount =
          Math.abs(event.deltaY) >
          Math.abs(event.deltaX)
            ? event.deltaY
            : event.deltaX;

        targetX -=
          amount *
          DESKTOP_SCROLL_SPEED;

        velocity =
          -amount * 0.055;

        clampDesktopTarget();
      },
      {
        passive: false
      }
    );


    /* DESKTOP DRAG */

    wrapper.addEventListener(
      "pointerdown",
      event => {
        if (
          activeImage ||
          !desktopMode.matches
        ) {
          return;
        }

        dragging = true;
        desktopMoved = false;

        dragStartX =
          event.clientX;

        lastPointerX =
          event.clientX;

        lastMoveTime =
          performance.now();

        velocity = 0;

        try {
          wrapper.setPointerCapture(
            event.pointerId
          );
        } catch (error) {}
      }
    );


    wrapper.addEventListener(
      "pointermove",
      event => {
        if (
          desktopMode.matches &&
          !activeImage
        ) {
          mouseInside = true;
          mouseX = event.clientX;
        }

        if (
          !desktopMode.matches ||
          !dragging ||
          activeImage
        ) {
          return;
        }

        const now =
          performance.now();

        const difference =
          event.clientX -
          lastPointerX;

        const elapsed =
          Math.max(
            now - lastMoveTime,
            1
          );

        if (
          Math.abs(
            event.clientX -
            dragStartX
          ) >
          DRAG_THRESHOLD
        ) {
          desktopMoved = true;
        }

        targetX += difference;

        velocity =
          (difference / elapsed) * 16;

        clampDesktopTarget();

        lastPointerX =
          event.clientX;

        lastMoveTime = now;
      }
    );


    wrapper.addEventListener(
      "pointerup",
      event => {
        if (
          !desktopMode.matches
        ) {
          return;
        }

        dragging = false;

        try {
          wrapper.releasePointerCapture(
            event.pointerId
          );
        } catch (error) {}
      }
    );


    wrapper.addEventListener(
      "pointercancel",
      () => {
        if (
          desktopMode.matches
        ) {
          dragging = false;
        }
      }
    );


    /* DESKTOP HOVER */

    wrapper.addEventListener(
      "pointerenter",
      event => {
        if (
          !desktopMode.matches ||
          activeImage
        ) {
          return;
        }

        mouseInside = true;
        mouseX = event.clientX;
      }
    );


    wrapper.addEventListener(
      "pointerleave",
      () => {
        if (
          !desktopMode.matches
        ) {
          return;
        }

        mouseInside = false;
        mouseX = null;

        if (!dragging) {
          desktopMoved = false;
        }
      }
    );


    /* TOUCH TAP DETECTION */

    wrapper.addEventListener(
      "touchstart",
      event => {
        if (
          desktopMode.matches ||
          !event.touches.length
        ) {
          return;
        }

        touchMoved = false;

        touchStartX =
          event.touches[0].clientX;

        touchStartY =
          event.touches[0].clientY;
      },
      {
        passive: true
      }
    );


    wrapper.addEventListener(
      "touchmove",
      event => {
        if (
          desktopMode.matches ||
          !event.touches.length
        ) {
          return;
        }

        const x =
          event.touches[0].clientX;

        const y =
          event.touches[0].clientY;

        const distanceX =
          Math.abs(
            x - touchStartX
          );

        const distanceY =
          Math.abs(
            y - touchStartY
          );

        if (
          distanceX >
          DRAG_THRESHOLD ||
          distanceY >
          DRAG_THRESHOLD
        ) {
          touchMoved = true;
        }
      },
      {
        passive: true
      }
    );


    /* PHOTO CLICKS */

    cards.forEach(card => {
      card.addEventListener(
        "click",
        event => {
          if (activeImage) {
            return;
          }

          if (
            desktopMode.matches &&
            desktopMoved
          ) {
            event.preventDefault();
            desktopMoved = false;
            return;
          }

          if (
            !desktopMode.matches &&
            touchMoved
          ) {
            event.preventDefault();
            touchMoved = false;
            return;
          }

          const photo =
            card.querySelector(
              ".photo"
            );

          openPhoto(photo);
        }
      );
    });


    /* CLOSE */

    overlay.addEventListener(
      "click",
      closePhoto
    );


    document.addEventListener(
      "keydown",
      event => {
        if (
          event.key === "Escape"
        ) {
          closePhoto();
        }
      }
    );


    /* DESKTOP MAGNIFICATION */

    function updateDesktopMagnification() {
      cards.forEach(card => {
        let targetScale = 1;

        if (
          mouseInside &&
          mouseX !== null &&
          !activeImage
        ) {
          const rect =
            card.getBoundingClientRect();

          const center =
            rect.left +
            rect.width / 2;

          const distance =
            Math.abs(
              mouseX - center
            );

          let influence =
            1 -
            distance /
            DESKTOP_MAGNET_DISTANCE;

          influence =
            clamp(
              influence,
              0,
              1
            );

          influence =
            smoothstep(influence);

          targetScale =
            1 +
            influence *
            (
              DESKTOP_MAX_SCALE -
              1
            );
        }

        if (
          card.currentScale ===
          undefined
        ) {
          card.currentScale = 1;
        }

        card.currentScale +=
          (
            targetScale -
            card.currentScale
          ) *
          DESKTOP_SCALE_SPEED;

        card.style.transform =
          `translateZ(0) scale(${card.currentScale})`;

        card.style.zIndex =
          Math.round(
            card.currentScale *
            100
          );
      });
    }


    /* TOUCH CENTER MAGNIFICATION */

    function updateTouchMagnification() {
      if (activeImage) {
        return;
      }

      const wrapperRect =
        wrapper.getBoundingClientRect();

      const focalPoint =
        wrapperRect.left +
        wrapperRect.width / 2;

      cards.forEach(card => {
        const rect =
          card.getBoundingClientRect();

        const center =
          rect.left +
          rect.width / 2;

        const distance =
          Math.abs(
            focalPoint -
            center
          );

        let influence =
          1 -
          distance /
          TOUCH_MAGNET_DISTANCE;

        influence =
          clamp(
            influence,
            0,
            1
          );

        influence =
          smoothstep(influence);

        const targetScale =
          1 +
          influence *
          (
            TOUCH_MAX_SCALE -
            1
          );

        if (
          card.currentScale ===
          undefined
        ) {
          card.currentScale = 1;
        }

        if (
          card.scaleVelocity ===
          undefined
        ) {
          card.scaleVelocity = 0;
        }

        const springForce =
          (
            targetScale -
            card.currentScale
          ) *
          TOUCH_SPRING;

        card.scaleVelocity +=
          springForce;

        card.scaleVelocity *=
          TOUCH_DAMPING;

        card.currentScale +=
          card.scaleVelocity;

        card.style.transform =
          `translateZ(0) scale(${card.currentScale})`;

        card.style.zIndex =
          Math.round(
            card.currentScale *
            100
          );
      });
    }


    /* ANIMATION */

    function animate() {
      if (desktopMode.matches) {

        if (
          !dragging &&
          !activeImage
        ) {
          targetX += velocity;

          clampDesktopTarget();

          velocity *=
            DESKTOP_FRICTION;

          const bounds =
            getDesktopBounds();

          if (
            targetX <= bounds.min ||
            targetX >= bounds.max
          ) {
            velocity *= 0.45;
          }

          if (
            Math.abs(velocity) <
            0.01
          ) {
            velocity = 0;
          }
        }

        currentX +=
          (
            targetX -
            currentX
          ) *
          DESKTOP_STRIP_SMOOTHNESS;

        strip.style.transform =
          `translate3d(${currentX}px, 0, 0)`;

        updateDesktopMagnification();

      } else {

        strip.style.transform =
          "none";

        updateTouchMagnification();
      }

      requestAnimationFrame(
        animate
      );
    }


    /* RESIZE */

    window.addEventListener(
      "resize",
      () => {
        if (
          desktopMode.matches
        ) {
          clampDesktopTarget();

          const bounds =
            getDesktopBounds();

          currentX =
            clamp(
              currentX,
              bounds.min,
              bounds.max
            );
        }

        if (
          activeImage &&
          originalImage &&
          !closing
        ) {
          positionExpandedPhoto();
        }
      }
    );


    /* START */

    window.addEventListener(
      "load",
      () => {
        if (
          desktopMode.matches
        ) {
          centerDesktopStart();
        } else {
          wrapper.scrollLeft = 0;
        }

        animate();
      }
    );
  </script>
