<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>nate gudmestad</title>
  <link rel="stylesheet" href="style-simple.css?v=1">
</head>

<body>
  <header class="site-header">
    <img class="signature" src="signature.png" alt="Nate Gudmestad">
  </header>

  <main class="home">
    <nav class="home-links" aria-label="Main navigation">
      <a href="resume/nategud_resume_2026.pdf">resume</a>
      <a href="portfolio/nategud_portfolio_2026_16x9.pdf">portfolio</a>
      <a href="photography/photography.html">photography</a>
      <a href="contact/contact.html">contact</a>
    </nav>
  </main>

  <script>
    const navigation = document.querySelector(".home-links");
    const links = [...navigation.querySelectorAll("a")];
    const pointerMode = window.matchMedia("(hover: hover) and (pointer: fine)");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    const MAX_SCALE = 1.18;
    const MAGNET_DISTANCE = 190;
    const SCALE_SPEED = 0.16;

    let pointerX = null;
    let pointerY = null;
    let pointerInside = false;
    let animationFrame = null;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function smoothstep(value) {
      return value * value * (3 - 2 * value);
    }

    function updateLinks() {
      let stillMoving = false;

      links.forEach(link => {
        let targetScale = 1;

        if (pointerInside && pointerX !== null && pointerY !== null) {
          const rect = link.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;
          const distance = Math.hypot(pointerX - centerX, pointerY - centerY);
          const influence = smoothstep(
            clamp(1 - distance / MAGNET_DISTANCE, 0, 1)
          );

          targetScale = 1 + influence * (MAX_SCALE - 1);
        }

        const currentScale = Number(link.dataset.scale || 1);
        const nextScale = currentScale + (targetScale - currentScale) * SCALE_SPEED;

        link.dataset.scale = nextScale;
        link.style.transform = `translateZ(0) scale(${nextScale})`;

        if (Math.abs(targetScale - nextScale) > 0.001) {
          stillMoving = true;
        }
      });

      if (pointerInside || stillMoving) {
        animationFrame = requestAnimationFrame(updateLinks);
      } else {
        animationFrame = null;
      }
    }

    function startAnimation() {
      if (!animationFrame && pointerMode.matches && !reducedMotion.matches) {
        animationFrame = requestAnimationFrame(updateLinks);
      }
    }

    navigation.addEventListener("pointerenter", event => {
      if (!pointerMode.matches || reducedMotion.matches) return;
      pointerInside = true;
      pointerX = event.clientX;
      pointerY = event.clientY;
      startAnimation();
    });

    navigation.addEventListener("pointermove", event => {
      if (!pointerMode.matches || reducedMotion.matches) return;
      pointerInside = true;
      pointerX = event.clientX;
      pointerY = event.clientY;
      startAnimation();
    });

    navigation.addEventListener("pointerleave", () => {
      pointerInside = false;
      pointerX = null;
      pointerY = null;
      startAnimation();
    });
  </script>
</body>
</html>
